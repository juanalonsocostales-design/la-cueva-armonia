<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Cueva de la Armonía V5</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f4f6;
margin:0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

.stats{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:15px;
font-weight:bold;
}

.ok{
color:green;
font-weight:bold;
}

.bad{
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎸 La Cueva de la Armonía</h1>
<h2>Juan Alonso Bass Academy</h2>

<div class="stats">
<div id="puntos">⭐ 0</div>
<div id="aciertos">✅ 0</div>
<div id="fallos">❌ 0</div>
</div>

<div class="menu">

<button onclick="abrirModulo('triadas')">
🎵 Tríadas
</button>

<button onclick="abrirModulo('cuatriadas')">
🎹 Cuatriadas
</button>

<button onclick="abrirModulo('tonalidades')">
🎼 Tonalidades
</button>

<button onclick="abrirModulo('pentatonicas')">
🎸 Pentatónicas
</button>

<button style="grid-column:span 2"
onclick="abrirExamen()">
🏆 Examen Final
</button>

</div>

</div>

<div id="contenido">

<div class="card">
<h2>Bienvenido</h2>
<p>Selecciona un módulo.</p>
</div>

</div>

</div>

<script>

let puntos=0;
let aciertos=0;
let fallos=0;
let preguntaActual=null;

function actualizarMarcadores(){

document.getElementById("puntos").innerHTML="⭐ "+puntos;
document.getElementById("aciertos").innerHTML="✅ "+aciertos;
document.getElementById("fallos").innerHTML="❌ "+fallos;

}

const banco={

triadas:[

{
pregunta:"¿Qué acorde forman las notas C-E-G?",
correcta:"C",
opciones:["Cm","C","C7","Cmaj7"]
},

{
pregunta:"¿Qué acorde forman las notas A-C-E?",
correcta:"Am",
opciones:["Am","A","A7","Adim"]
},

{
pregunta:"¿Qué acorde forman las notas B-D-F?",
correcta:"Bdim",
opciones:["Bm","B","Bdim","B7"]
}

],

cuatriadas:[

{
pregunta:"¿Qué acorde forman las notas C-E-G-B?",
correcta:"Cmaj7",
opciones:["C7","Cm7","Cmaj7","Cdim7"]
},

{
pregunta:"¿Qué acorde forman las notas A-C-E-G?",
correcta:"Am7",
opciones:["A7","Am7","Amaj7","Adim7"]
}

],

tonalidades:[

{
pregunta:"¿Cuál es la relativa menor de C Mayor?",
correcta:"Am",
opciones:["Am","Em","Dm","Bm"]
},

{
pregunta:"¿Cuál es la relativa mayor de Em?",
correcta:"G",
opciones:["G","C","D","A"]
}

],

pentatonicas:[

{
pregunta:"¿Qué notas forman la pentatónica menor de Am?",
correcta:"A C D E G",
opciones:[
"A C D E G",
"A B C E G",
"A C E F G",
"A C D F G"
]
},

{
pregunta:"¿Qué notas forman la pentatónica mayor de C?",
correcta:"C D E G A",
opciones:[
"C D E G A",
"C D F G A",
"C E F G A",
"C D E F A"
]
}

]

};

function obtenerPregunta(modulo){

const lista=banco[modulo];

return lista[
Math.floor(Math.random()*lista.length)
];

}

function abrirModulo(modulo){

preguntaActual=
obtenerPregunta(modulo);

let html=`

<div class="card">

<h2>${modulo.toUpperCase()}</h2>

<h3>${preguntaActual.pregunta}</h3>

`;

preguntaActual.opciones.forEach(opcion=>{

html+=`

<label>
<input
type="radio"
name="respuesta"
value="${opcion}">
${opcion}
</label>

<br><br>

`;

});

html+=`

<button onclick="corregirModulo('${modulo}')">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

function corregirModulo(modulo){

let respuesta=
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

if(
respuesta.value===
preguntaActual.correcta
){

puntos+=10;
aciertos++;

document.getElementById("resultado").innerHTML=
"<p class='ok'>✅ Correcto</p>";

}else{

fallos++;

document.getElementById("resultado").innerHTML=
"<p class='bad'>❌ Correcta: "+
preguntaActual.correcta+
"</p>";

}

actualizarMarcadores();

document.getElementById("resultado").innerHTML+=

"<br><button onclick=\"abrirModulo('"+
modulo+
"')\">Siguiente pregunta</button>";

}

function abrirExamen(){

let modulos=[
"triadas",
"cuatriadas",
"tonalidades",
"pentatonicas"
];

let modulo=
modulos[
Math.floor(
Math.random()*modulos.length
)
];

abrirModulo(modulo);

}

actualizarMarcadores();

</script>

</body>
</html>
