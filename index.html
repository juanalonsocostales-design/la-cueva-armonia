<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Cueva de la Armonía</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.stats{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:15px;
    font-weight:bold;
}

.correcto{
    color:green;
    font-weight:bold;
}

.incorrecto{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎸 La Cueva de la Armonía</h1>

<h2>Juan Alonso Bass Academy</h2>

<div class="stats">

<div id="puntos">⭐ 0</div>

<div id="aciertos">✅ 0</div>

<div id="fallos">❌ 0</div>

</div>

<div class="menu">

<button onclick="abrirTriadas()">
🎵 Tríadas
</button>

<button onclick="abrirCuatriadas()">
🎹 Cuatriadas
</button>

<button onclick="abrirTonalidades()">
🎼 Tonalidades
</button>

<button onclick="abrirPentatonicas()">
🎸 Pentatónicas
</button>

<button
style="grid-column:span 2"
onclick="abrirExamen()">
🏆 Examen Final
</button>

</div>

</div>

<div id="contenido">

<div class="card">

<h2>Bienvenido</h2>

<p>
Selecciona un módulo para empezar.
</p>

</div>

</div>

</div>

<script>

let puntos=0;
let aciertos=0;
let fallos=0;

function actualizarMarcadores(){

document.getElementById("puntos").innerHTML=
"⭐ "+puntos;

document.getElementById("aciertos").innerHTML=
"✅ "+aciertos;

document.getElementById("fallos").innerHTML=
"❌ "+fallos;

}

const triadas=[

{
pregunta:"¿Qué acorde forman las notas C-E-G?",
correcta:"C",
opciones:["Cm","C","C7","Cmaj7"]
},

{
pregunta:"¿Qué acorde forman las notas A-C-E?",
correcta:"Am",
opciones:["Am","A","A7","Adim"]
},

{
pregunta:"¿Qué acorde forman las notas B-D-F?",
correcta:"Bdim",
opciones:["Bm","B","Bdim","B7"]
},

{
pregunta:"¿Qué acorde forman las notas E-G-B?",
correcta:"Em",
opciones:["E","Em","E7","Edim"]
}

];

function preguntaAleatoria(){

return triadas[
Math.floor(Math.random()*triadas.length)
];

}

function abrirTriadas(){

let p=preguntaAleatoria();

let html=`

<div class="card">

<h2>🎵 Tríadas</h2>

<h3>${p.pregunta}</h3>

`;

for(let i=0;i<p.opciones.length;i++){

html+=`

<label>

<input
type="radio"
name="respuesta"
value="${p.opciones[i]}">

${p.opciones[i]}

</label>

<br><br>

`;

}

html+=`

<button onclick="corregir('${p.correcta}')">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

function corregir(correcta){

let respuesta=
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

if(respuesta.value===correcta){

puntos+=10;
aciertos++;

document.getElementById("resultado").innerHTML=
"<p class='correcto'>✅ Correcto</p>";

}else{

fallos++;

document.getElementById("resultado").innerHTML=
"<p class='incorrecto'>❌ Correcto: "+correcta+"</p>";

}

actualizarMarcadores();

}

function abrirCuatriadas(){

document.getElementById("contenido").innerHTML=
`
<div class="card">
<h2>🎹 Cuatriadas</h2>
<p>Próximamente.</p>
</div>
`;

}

function abrirTonalidades(){

document.getElementById("contenido").innerHTML=
`
<div class="card">
<h2>🎼 Tonalidades</h2>
<p>Próximamente.</p>
</div>
`;

}

function abrirPentatonicas(){

document.getElementById("contenido").innerHTML=
`
<div class="card">
<h2>🎸 Pentatónicas</h2>
<p>Próximamente.</p>
</div>
`;

}

function abrirExamen(){

document.getElementById("contenido").innerHTML=
`
<div class="card">
<h2>🏆 Examen Final</h2>
<p>Próximamente.</p>
</div>
`;

}

actualizarMarcadores();

</script>

</body>
</html>
