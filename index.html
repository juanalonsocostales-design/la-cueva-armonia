<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Cueva de la Armonía</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:#1d4ed8;
}

.respuesta{
    margin-top:10px;
}

.correcta{
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎸 La Cueva de la Armonía de Bol</h1>

<h2>Academia de Armonía Moderna</h2>

<p>Selecciona un módulo de estudio:</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

<button onclick="abrirTriadas()">🎵 Tríadas</button>

<button onclick="proximamente()">🎹 Cuatriadas</button>

<button onclick="proximamente()">🎼 Tonalidades</button>

<button onclick="proximamente()">🎸 Pentatónicas</button>

<button style="grid-column:span 2;" onclick="proximamente()">
🏆 Examen Final
</button>

</div>

</div>

<div id="quiz"></div>

</div>

<script>

function abrirTriadas(){

document.getElementById("quiz").innerHTML=`

<div class="card">

<h2>🎵 Módulo de Tríadas</h2>

<h3>¿Qué acorde forman las notas C - E - G?</h3>

<label class="respuesta">
<input type="radio" name="t1" value="0">
Cm
</label>
<br>

<label class="respuesta">
<input type="radio" name="t1" value="1">
C
</label>
<br>

<label class="respuesta">
<input type="radio" name="t1" value="2">
C7
</label>
<br>

<label class="respuesta">
<input type="radio" name="t1" value="3">
Cmaj7
</label>

<br><br>

<button onclick="corregirTriada()">
Corregir
</button>

<div id="resultadoTriada"></div>

</div>

`;

}

function corregirTriada(){

const respuesta=
document.querySelector('input[name="t1"]:checked');

if(!respuesta){

document.getElementById("resultadoTriada").innerHTML=
"<p>⚠️ Selecciona una respuesta.</p>";

return;

}

if(respuesta.value==="1"){

document.getElementById("resultadoTriada").innerHTML=
"<p class='correcta'>✅ Correcto. C-E-G forma un acorde de C Mayor.</p>";

}else{

document.getElementById("resultadoTriada").innerHTML=
"<p>❌ Incorrecto. La respuesta correcta es C.</p>";

}

}

function proximamente(){

document.getElementById("quiz").innerHTML=`

<div class="card">

<h2>🚧 Módulo en construcción</h2>

<p>Este módulo estará disponible próximamente.</p>

</div>

`;

}

</script>

</body>

</html>
