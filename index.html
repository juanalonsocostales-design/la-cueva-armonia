 function mezclarArray(array){

return [...array].sort(() => Math.random() - 0.5);

} 
  
function obtenerPregunta(modulo){

const lista=banco[modulo];

let pregunta =
JSON.parse(
JSON.stringify(
lista[
Math.floor(Math.random()*lista.length)
]
)
);

pregunta.opciones =
mezclarArray(
pregunta.opciones
);

return pregunta;

}

function abrirModulo(modulo){

preguntaActual=
obtenerPregunta(modulo);

let html=`

<div class="card">

<h2>${modulo.toUpperCase()}</h2>

<h3>${preguntaActual.pregunta}</h3>

`;

preguntaActual.opciones.forEach(opcion=>{

html+=`

<label>
<input
type="radio"
name="respuesta"
value="${opcion}">
${opcion}
</label>

<br><br>

`;

});

html+=`

<button onclick="corregirModulo('${modulo}')">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

function corregirModulo(modulo){

let respuesta=
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

if(
respuesta.value===
preguntaActual.correcta
){

puntos+=10;
aciertos++;

document.getElementById("resultado").innerHTML=
"<p class='ok'>✅ Correcto</p>";

}else{

fallos++;

document.getElementById("resultado").innerHTML=
"<p class='bad'>❌ Correcta: "+
preguntaActual.correcta+
"</p>";

}

actualizarMarcadores();

document.getElementById("resultado").innerHTML+=

"<br><button onclick=\"abrirModulo('"+
modulo+
"')\">Siguiente pregunta</button>";

}

function abrirExamen(){

examenPreguntas=[];

Object.keys(banco).forEach(modulo=>{

banco[modulo].forEach(pregunta=>{

examenPreguntas.push({
modulo:modulo,
pregunta:pregunta
});

});

});

examenPreguntas=
examenPreguntas.sort(
()=>Math.random()-0.5
);

examenPreguntas=
examenPreguntas.slice(0,20);

examenIndice=0;
examenAciertos=0;

mostrarPreguntaExamen();

}

 function mostrarPreguntaExamen(){

let actual=
examenPreguntas[examenIndice];

let html=`

<div class="card">

<h2>
🏆 Examen Final
</h2>

<p>
Pregunta ${examenIndice+1} de ${examenPreguntas.length}
</p>

<h3>
${actual.pregunta.pregunta}
</h3>

`;

actual.pregunta.opciones.forEach(opcion=>{

html+=`

<label>

<input
type="radio"
name="respuestaExamen"
value="${opcion}">

${opcion}

</label>

<br><br>

`;

});

html+=`

<button onclick="corregirExamen()">
Responder
</button>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

 function corregirExamen(){

let respuesta=
document.querySelector(
'input[name="respuestaExamen"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

let actual=
examenPreguntas[examenIndice];

if(
respuesta.value===
actual.pregunta.correcta
){

examenAciertos++;

}

examenIndice++;

if(
examenIndice>=
examenPreguntas.length
){

mostrarResultadoExamen();

return;

}

mostrarPreguntaExamen();

}

function mostrarResultadoExamen(){

let nota=
(
examenAciertos /
examenPreguntas.length
)*10;

let nivel="";

if(nota<5){

nivel="❌ Suspenso";

}else if(nota<7){

nivel="✅ Aprobado";

}else if(nota<9){

nivel="🏅 Notable";

}else{

let modulos=[
"triadas",
"cuatriadas",
"tonalidades",
"pentatonicas"
];

let modulo=
modulos[
Math.floor(
Math.random()*modulos.length
)
];

abrirModulo(modulo);

}

actualizarMarcadores();
