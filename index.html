 function mezclarArray(array){

return [...array].sort(() => Math.random() - 0.5);

} 
  
function obtenerPregunta(modulo){

const lista=banco[modulo];

let pregunta =
JSON.parse(
JSON.stringify(
lista[
Math.floor(Math.random()*lista.length)
]
)
);

pregunta.opciones =
mezclarArray(
pregunta.opciones
);

return pregunta;

}

function abrirModulo(modulo){

preguntaActual=
obtenerPregunta(modulo);

let html=`

<div class="card">

<h2>${modulo.toUpperCase()}</h2>

<h3>${preguntaActual.pregunta}</h3>

`;

preguntaActual.opciones.forEach(opcion=>{

html+=`

<label>
<input
type="radio"
name="respuesta"
value="${opcion}">
${opcion}
</label>

<br><br>

`;

});

html+=`

<button onclick="corregirModulo('${modulo}')">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

function corregirModulo(modulo){

let respuesta=
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

if(
respuesta.value===
preguntaActual.correcta
){

puntos+=10;
aciertos++;

document.getElementById("resultado").innerHTML=
"<p class='ok'>✅ Correcto</p>";

}else{

fallos++;

document.getElementById("resultado").innerHTML=
"<p class='bad'>❌ Correcta: "+
preguntaActual.correcta+
"</p>";

}

actualizarMarcadores();

document.getElementById("resultado").innerHTML+=

"<br><button onclick=\"abrirModulo('"+
modulo+
"')\">Siguiente pregunta</button>";

}
