<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Cueva de la Armonía</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.correcta{
    color:green;
    font-weight:bold;
}

.incorrecta{
    color:red;
    font-weight:bold;
}

.stats{
    display:flex;
    gap:20px;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎸 La Cueva de la Armonía</h1>

<h2>Juan Alonso Bass Academy</h2>

<p>Selecciona un módulo:</p>

<div class="menu">

<button onclick="abrirTriadas()">🎵 Tríadas</button>

<button onclick="moduloConstruccion()">🎹 Cuatriadas</button>

<button onclick="moduloConstruccion()">🎼 Tonalidades</button>

<button onclick="moduloConstruccion()">🎸 Pentatónicas</button>

<button style="grid-column:span 2;" onclick="moduloConstruccion()">
🏆 Examen Final
</button>

</div>

</div>

<div id="contenido"></div>

</div>

<script>

let puntos=0;
let intentos=0;
let respuestaCorrecta="";

const triadas=[
{
notas:"C - E - G",
acorde:"C",
opciones:["Cm","C","C7","Cmaj7"]
},
{
notas:"A - C - E",
acorde:"Am",
opciones:["Am","A","A7","Adim"]
},
{
notas:"B - D - F",
acorde:"Bdim",
opciones:["Bm","B","Bdim","B7"]
},
{
notas:"E - G - B",
acorde:"Em",
opciones:["E","Em","E7","Edim"]
},
{
notas:"D - F# - A",
acorde:"D",
opciones:["D","Dm","D7","Dmaj7"]
},
{
notas:"G - B - D",
acorde:"G",
opciones:["G","Gm","G7","Gmaj7"]
}
];

function abrirTriadas(){
nuevaPreguntaTriadas();
}

function nuevaPreguntaTriadas(){

const pregunta=
triadas[Math.floor(Math.random()*triadas.length)];

respuestaCorrecta=pregunta.acorde;

let html=`

<div class="card">

<h2>🎵 Módulo de Tríadas</h2>

<div class="stats">

<div>⭐ Puntos: ${puntos}</div>

<div>📝 Intentos: ${intentos}</div>

</div>

<h3>¿Qué acorde forman las notas?</h3>

<h1>${pregunta.notas}</h1>

`;

pregunta.opciones.forEach(opcion=>{

html+=`

<label>

<input type="radio" name="respuesta" value="${opcion}">

${opcion}

</label>

<br><br>

`;

});

html+=`

<button onclick="corregirTriada()">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=html;

}

function corregirTriada(){

const seleccionada=
document.querySelector('input[name="respuesta"]:checked');

if(!seleccionada){

alert("Selecciona una respuesta");

return;

}

intentos++;

if(seleccionada.value===respuestaCorrecta){

puntos++;

document.getElementById("resultado").innerHTML=
`
<p class="correcta">
✅ Correcto
</p>

<button onclick="nuevaPreguntaTriadas()">
Siguiente pregunta
</button>
`;

}else{

document.getElementById("resultado").innerHTML=
`
<p class="incorrecta">
❌ Incorrecto

<br><br>

Respuesta correcta:
<strong>${respuestaCorrecta}</strong>

</p>

<button onclick="nuevaPreguntaTriadas()">
Siguiente pregunta
</button>
`;

}

}

function moduloConstruccion(){

document.getElementById("contenido").innerHTML=
`

<div class="card">

<h2>🚧 Módulo en construcción</h2>

<p>
Este módulo estará disponible próximamente.
</p>

<p>
Próximos módulos:
</p>

<ul>
<li>Cuatriadas</li>
<li>Tonalidades Mayores y Menores</li>
<li>Relativas</li>
<li>Pentatónicas</li>
<li>Examen Final</li>
</ul>

</div>

`;

}

</script>

</body>
</html>
