<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Cueva de la Armonía</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f4f6;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
}

button:hover{
background:#1d4ed8;
}
</style>

</head>
<body>

<div class="container">

<div class="card">

<h1>🎸 La Cueva de la Armonía</h1>

<h2>Academia de Armonía Moderna</h2>

<p>Selecciona un módulo:</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

<button onclick="abrirTriadas()">🎵 Tríadas</button>

<button onclick="proximamente()">🎹 Cuatriadas</button>

<button onclick="proximamente()">🎼 Tonalidades</button>

<button onclick="proximamente()">🎸 Pentatónicas</button>

<button style="grid-column:span 2;" onclick="proximamente()">
🏆 Examen Final
</button>

</div>

</div>

<div id="contenido"></div>

</div>

<script>

function abrirTriadas(){

document.getElementById("contenido").innerHTML=`

<div class="card">

<h2>🎵 Módulo de Tríadas</h2>

<h3>¿Qué acorde forman las notas C-E-G?</h3>

<ul>
<li>Cm</li>
<li><strong>C ✅</strong></li>
<li>C7</li>
<li>Cmaj7</li>
</ul>

</div>

`;

}

function proximamente(){

document.getElementById("contenido").innerHTML=`

<div class="card">

<h2>🚧 En construcción</h2>

<p>Este módulo estará disponible próximamente.</p>

</div>

`;

}

</script>

</body>
</html>
