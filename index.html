<h2>🎵 11. Escala Pentatónica Mayor</h2>

<div class="teoria-box">

La escala pentatónica mayor es una versión simplificada de la escala mayor.

Contiene solamente cinco notas, por eso recibe el nombre de "pentatónica".

</div>

<h3>📐 Fórmula</h3>

<div class="codigo">

1 - 2 - 3 - 5 - 6

</div>

<div class="regla-box">

✅ Una escala pentatónica siempre contiene 5 notas.

</div>

<h3>🎹 Ejemplo: Pentatónica Mayor de C</h3>

<div class="codigo">

C D E G A

</div>

<div class="ejemplo-box">

Escala Mayor de C:

<div class="codigo">

C D E F G A B

</div>

Eliminamos:

<br><br>

❌ IV grado = F

<br>

❌ VII grado = B

<br><br>

Resultado:

<div class="codigo">

✅ C D E G A

</div>

</div>

<h3>🎯 Cómo construir una pentatónica mayor</h3>

<div class="teoria-box">

Partimos de una escala mayor completa y eliminamos:

<br><br>

✅ IV grado

<br>

✅ VII grado

</div>

<h3>🎵 Ejemplos rápidos</h3>

<table>

<tr>
<th>Escala Mayor</th>
<th>Pentatónica Mayor</th>
</tr>

<tr>
<td>C Mayor</td>
<td>C D E G A</td>
</tr>

<tr>
<td>G Mayor</td>
<td>G A B D E</td>
</tr>

<tr>
<td>D Mayor</td>
<td>D E F# A B</td>
</tr>

<tr>
<td>A Mayor</td>
<td>A B C# E F#</td>
</tr>

</table>

<h3>🎸 Aplicación práctica</h3>

<div class="ejemplo-box">

La pentatónica mayor se utiliza constantemente en:

<br><br>

✅ Pop

<br>

✅ Country

<br>

✅ Rock melódico

<br>

✅ Blues

<br>

✅ Música moderna

</div>

<div class="regla-box">

📌 La pentatónica mayor evita las notas que generan más tensión.

Por eso es una de las primeras escalas utilizadas para improvisar.

</div>

<h3>🎯 Relación con la pentatónica menor</h3>

<div class="ejemplo-box">

Pentatónica Mayor de C

<div class="codigo">

C D E G A

</div>

Pentatónica Menor de Am

<div class="codigo">

A C D E G

</div>

Comparten exactamente las mismas notas.

</div>

<div class="regla-box">

📌 Las pentatónicas relativas comparten notas pero tienen distinto centro tonal.

</div>

<h2>🎵 12. Escala Pentatónica Menor</h2>

<div class="teoria-box">

La escala pentatónica menor es una de las herramientas más utilizadas para improvisar.

Es la escala más importante en blues, rock, reggae y bajo eléctrico.

</div>

<h3>📐 Fórmula</h3>

<div class="codigo">

1 - b3 - 4 - 5 - b7

</div>

<div class="regla-box">

✅ Contiene únicamente 5 notas.

<br><br>

✅ Se obtiene eliminando el II y el VI grado de la escala menor natural.

</div>

<h3>🎹 Ejemplo: Pentatónica Menor de A</h3>

<div class="codigo">

A C D E G

</div>

<div class="ejemplo-box">

Escala Menor Natural de A:

<div class="codigo">

A B C D E F G

</div>

Eliminamos:

<br><br>

❌ B (II grado)

<br>

❌ F (VI grado)

<br><br>

Resultado:

<div class="codigo">

✅ A C D E G

</div>

</div>

<h3>🎯 Cómo construir una pentatónica menor</h3>

<div class="teoria-box">

Partimos de una escala menor natural y eliminamos:

<br><br>

✅ II grado

<br>

✅ VI grado

</div>

<h3>🎸 Aplicación práctica</h3>

<div class="ejemplo-box">

La pentatónica menor se utiliza constantemente en:

<br><br>

✅ Blues

<br>

✅ Rock

<br>

✅ Reggae

<br>

✅ Funk

<br>

✅ Improvisación moderna

</div>

<h3>🎵 Ejemplos en diferentes tonalidades</h3>

<table>

<tr>
<th>Tonalidad</th>
<th>Pentatónica Menor</th>
</tr>

<tr>
<td>Am</td>
<td>A C D E G</td>
</tr>

<tr>
<td>Em</td>
<td>E G A B D</td>
</tr>

<tr>
<td>Bm</td>
<td>B D E F# A</td>
</tr>

<tr>
<td>F#m</td>
<td>F# A B C# E</td>
</tr>

</table>

<h3>🎧 Sonoridad</h3>

<div class="teoria-box">

La pentatónica menor tiene una sonoridad más intensa y expresiva que la pentatónica mayor.

Es la escala más utilizada para crear riffs, líneas de bajo e improvisaciones.

</div>

<div class="regla-box">

📌 Si tienes que aprender una sola escala para improvisar, aprende primero la pentatónica menor.

Es la más utilizada en la música moderna.

</div>

<h3>🎯 Ejemplo de frase sencilla</h3>

<div class="codigo">

A → C → D → E → G

</div>

<div class="ejemplo-box">

Con estas cinco notas ya puedes crear cientos de melodías, solos y líneas de bajo.

</div>

<hr>
<h2>🎵 13. Relación Pentatónica Mayor-Menor</h2>

<div class="teoria-box">

Una pentatónica mayor y su relativa menor comparten exactamente las mismas notas.

Lo que cambia es la nota que actúa como centro tonal.

</div>

<h3>🎯 Ejemplo principal</h3>

<div class="ejemplo-box">

Pentatónica Mayor de C

<div class="codigo">

C D E G A

</div>

Pentatónica Menor de Am

<div class="codigo">

A C D E G

</div>

Las notas son exactamente las mismas.

</div>

<div class="regla-box">

📌 Las notas no cambian.

📌 Lo que cambia es la sensación de reposo y resolución.

</div>

<h3>🎹 Relativas más importantes</h3>

<table>

<tr>
<th>Pentatónica Mayor</th>
<th>Pentatónica Menor Relativa</th>
</tr>

<tr>
<td>C D E G A</td>
<td>A C D E G</td>
</tr>

<tr>
<td>G A B D E</td>
<td>E G A B D</td>
</tr>

<tr>
<td>D E F# A B</td>
<td>B D E F# A</td>
</tr>

<tr>
<td>A B C# E F#</td>
<td>F# A B C# E</td>
</tr>

</table>

<h3>🎸 Aplicación práctica</h3>

<div class="ejemplo-box">

Progresión:

<div class="codigo">

Am - F - C - G

</div>

Puedes utilizar:

<div class="codigo">

Am Pentatónica

</div>

o pensar en:

<div class="codigo">

C Pentatónica Mayor

</div>

porque ambas contienen las mismas notas.

</div>

<div class="ejemplo-box">

Progresión:

<div class="codigo">

Em - C - G - D

</div>

Puedes utilizar:

<div class="codigo">

Em Pentatónica

</div>

o

<div class="codigo">

G Pentatónica Mayor

</div>

</div>

<h3>📚 Método rápido para encontrar la relativa</h3>

<div class="regla-box">

✅ Pentatónica Mayor → bajar al VI grado

<br><br>

Ejemplo:

<br>

C → Am

<br>

G → Em

<br>

D → Bm

</div>

<div class="regla-box">

✅ Pentatónica Menor → subir al III grado

<br><br>

Ejemplo:

<br>

Am → C

<br>

Em → G

<br>

Bm → D

</div>

<h3>🎯 Lo que debes recordar</h3>

<div class="teoria-box">

Si dos pentatónicas son relativas:

<br><br>

✅ Comparten las mismas notas

<br>

✅ Comparten los mismos dibujos en el instrumento

<br>

✅ Cambia únicamente el centro tonal

</div>

function abrirModulo(modulo){

preguntaActual=
obtenerPregunta(modulo);

let html=`

<div class="card">

<h2>${modulo.toUpperCase()}</h2>

<h3>${preguntaActual.pregunta}</h3>

`;

preguntaActual.opciones.forEach(opcion=>{

html+=`

<label>
<input
type="radio"
name="respuesta"
value="${opcion}">
${opcion}
</label>

<br><br>

`;

});

html+=`

<button onclick="corregirModulo('${modulo}')">
Corregir
</button>

<div id="resultado"></div>

</div>

`;

document.getElementById("contenido").innerHTML=
html;

}

function corregirModulo(modulo){

let respuesta=
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert("Selecciona una respuesta");

return;

}

if(
respuesta.value===
preguntaActual.correcta
){

puntos+=10;
aciertos++;

document.getElementById("resultado").innerHTML=
"<p class='ok'>✅ Correcto</p>";

}else{

fallos++;

document.getElementById("resultado").innerHTML=
"<p class='bad'>❌ Correcta: "+
preguntaActual.correcta+
"</p>";

}

actualizarMarcadores();

document.getElementById("resultado").innerHTML+=

"<br><button onclick=\"abrirModulo('"+
modulo+
"')\">Siguiente pregunta</button>";

}

function abrirExamen(){

let modulos=[
"triadas",
"cuatriadas",
"tonalidades",
"pentatonicas"
];

let modulo=
modulos[
Math.floor(
Math.random()*modulos.length
)
];

abrirModulo(modulo);

}

actualizarMarcadores();

</script>
